name: Notify search engines

# After a normal push to main that changes the sitemap, tell Bing and other IndexNow
# engines which pages changed. (The YouTube sync does this itself, because pushes made
# by the workflow token do not start other workflows.)
on:
  push:
    branches: [main]
    paths: [sitemap.xml]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Wait for GitHub Pages to publish
        run: sleep 120
      - name: Send changed pages to IndexNow
        run: |
          git show HEAD~1:sitemap.xml > /tmp/old_sitemap.xml 2>/dev/null || true
          python3 scripts/indexnow.py /tmp/old_sitemap.xml sitemap.xml
